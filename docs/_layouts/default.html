<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    {% feed_meta %}
  </head>
  <body>
    <header class="site-shell site-header">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="top-nav" aria-label="Primary">
        <a href="{{ '/' | relative_url }}">Posts</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        {% if site.social.github %}
          <a href="{{ site.social.github }}" target="_blank" rel="noreferrer">GitHub</a>
        {% endif %}
        {% if site.social.twitter %}
          <a href="{{ site.social.twitter }}" target="_blank" rel="noreferrer">X</a>
        {% endif %}
      </nav>
    </header>

    <main class="site-shell">
      {{ content }}
    </main>

    <footer class="site-shell site-footer">
      <p><a href="{{ '/feed.xml' | relative_url }}">RSS feed</a> · {{ site.footer_note }}</p>
    </footer>
  </body>
</html>
