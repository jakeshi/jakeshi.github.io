---
layout: default
---
<article class="post-body">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="meta">
      {{ page.date | date: "%b %-d, %Y" }}
      {% assign words = page.content | number_of_words %}
      {% assign mins = words | divided_by: 200 %}
      {% if mins == 0 %}{% assign mins = 1 %}{% endif %}
      · {{ mins }} min read
    </p>
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>
